name: deepdesk_app
description: "DeepDesk AI research reports."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  http: ^1.6.0
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  in_app_purchase_platform_interface: ^1.4.1
  in_app_purchase_storekit: ^0.4.6
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: store/out/icon-1024.png
  android: true
  adaptive_icon_background: "#123B73"
  adaptive_icon_foreground: store/out/icon-foreground.png
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
