<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { display: grid; place-items: center; }
  .mark { position: relative; width: 50%; height: 58%; }
  .stem { position: absolute; left: 0; top: 0; width: 21%; height: 100%; border-radius: 10px; background: white; }
  .bowl { position: absolute; left: 12%; top: 0; width: 88%; height: 100%; border: 62px solid white; border-left-width: 0; border-radius: 0 52% 52% 0; }
  .page { position: absolute; left: 47%; top: 22%; width: 27%; height: 56%; border-radius: 5%; background: transparent; border: 9px solid white; }
  .page::before, .page::after { content: ""; position: absolute; left: 18%; width: 64%; height: 8%; border-radius: 99px; background: white; }
  .page::before { top: 29%; }
  .page::after { top: 52%; }
</style>
</head>
<body><div class="mark" aria-label="D"><i class="stem"></i><i class="bowl"></i><i class="page"></i></div></body>
</html>
