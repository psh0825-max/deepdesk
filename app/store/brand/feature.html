<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #123B73; color: white; font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; display: flex; align-items: center; }
  .paper { position: absolute; border: 1px solid rgba(247,246,242,.16); background: rgba(247,246,242,.035); }
  .paper.one { width: 300px; height: 390px; left: 586px; top: 55px; }
  .paper.two { width: 232px; height: 310px; right: -34px; top: 112px; }
  .badge { width: 360px; height: 360px; margin-left: 68px; border-radius: 22%; background: #F7F6F2; display: grid; place-items: center; z-index: 1; }
  .inner { width: 82%; height: 82%; border-radius: 22%; background: #123B73; display: grid; place-items: center; }
  .mark { position: relative; width: 49%; height: 58%; }
  .stem { position: absolute; left: 0; top: 0; width: 21%; height: 100%; border-radius: 7px; background: white; }
  .bowl { position: absolute; left: 12%; top: 0; width: 88%; height: 100%; border: 35px solid white; border-left-width: 0; border-radius: 0 52% 52% 0; }
  .page { position: absolute; left: 47%; top: 22%; width: 27%; height: 56%; border-radius: 5%; background: #123B73; border: 6px solid white; }
  .page::before, .page::after { content: ""; position: absolute; left: 18%; width: 64%; height: 8%; border-radius: 99px; background: white; }
  .page::before { top: 29%; } .page::after { top: 52%; }
  .copy { margin-left: 74px; z-index: 1; white-space: nowrap; }
  h1 { margin: 0 0 18px; font-size: 82px; font-weight: 750; letter-spacing: -3px; }
  p { margin: 0; color: #F7F6F2; font-size: 23px; font-weight: 500; letter-spacing: -.35px; }
  .accent { width: 62px; height: 7px; border-radius: 99px; margin-bottom: 22px; background: #F2A93B; }
</style>
</head>
<body>
  <div class="paper one"></div><div class="paper two"></div>
  <div class="badge"><div class="inner"><div class="mark"><i class="stem"></i><i class="bowl"></i><i class="page"></i></div></div></div>
  <section class="copy"><div class="accent"></div><h1>DeepDesk</h1><p>주제만 적으면, 출처까지 검증한 리서치 리포트</p></section>
</body>
</html>
